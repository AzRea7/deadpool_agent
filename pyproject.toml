[project]
name = "fleet"
version = "0.1.0"
description = "Self-healing health agent for Azure Windows/IIS VM scale sets"
readme = "README.md"
authors = [
    { name = "AzRea7", email = "austinsilaghi@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-mgmt-compute>=39.0.0",
    "azure-monitor-query>=2.0.0",
    "celery>=5.7.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.2.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
fleet = "fleet:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
